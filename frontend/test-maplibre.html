<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MapLibre Test</title>
  <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 500px;}
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const key = urlParams.get('key');
    if (key) {
      const map = new maplibregl.Map({
        container: 'map',
        style: `https://maps.geoapify.com/v1/styles/osm-bright/style.json?apiKey=${key}`,
        center: [10, 20],
        zoom: 1.5,
      });
      map.on('error', e => console.error('MapError:', e.error?.message || e.error));
      map.on('load', () => console.log('MAP LOADED SUCCESS'));
    }
  </script>
</body>
</html>
